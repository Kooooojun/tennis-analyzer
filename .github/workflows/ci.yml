# Synthetic data only: never testset/, videos/, work/ or web/sessions/. No artifacts are uploaded.
# balltrack_best.pth: the HF page declares no license, so CI only downloads it into the runner cache (never redistributed).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
      - name: pip install
        run: |
          # CPU torch on Linux/Windows (same 2.15.0 pin, +cpu build) instead of the multi-GB CUDA wheel; macOS uses PyPI
          [ "$RUNNER_OS" = macOS ] && X= || X="--extra-index-url https://download.pytorch.org/whl/cpu"
          python -m pip install -q -r requirements.txt $X
          python -c "import mediapipe, torch, cv2; print('mediapipe', mediapipe.__version__, 'torch', torch.__version__, 'cv2', cv2.__version__)"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: models
          key: models-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: models (download to .part, then sha256)
        run: |
          mkdir -p models
          get() { [ -f "models/$1" ] || { curl -fsSL -o "models/$1.part" "$2" && mv "models/$1.part" "models/$1"; }; }
          get pose_heavy.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task
          get balltrack_best.pth https://huggingface.co/linfeng302/RacketVision-Models/resolve/main/checkpoints/balltrack_best.pth
          python - <<'PY'
          import hashlib
          want = {"pose_heavy.task": "64437af838a65d18e5ba7a0d39b465540069bc8aae8308de3e318aad31fcbc7b",
                  "balltrack_best.pth": "00d707b9db7a49561c411e4765956e79bcd7c7e20c7a0a535073440b3e972342"}
          for f, h in want.items():
              got = hashlib.sha256(open(f"models/{f}", "rb").read()).hexdigest()
              assert got == h, (f, got)
          print("models ok")
          PY
      - name: unit tests (each file is a plain-assert script; test_hand.py needs private data)
        run: |
          fail=0
          for f in tests/test_*.py tools/test_*.py; do
            [ "$f" = tests/test_hand.py ] && continue
            echo "== $f"; python "$f" || { echo "FAILED $f"; fail=1; }
          done
          exit $fail
      - name: site smoke under a non-UTF-8 console
        run: |
          [ "$RUNNER_OS" = Windows ] && chcp.com 936 || true
          PYTHONIOENCODING=cp1252 python tests/test_site_smoke.py
      - name: non-ASCII path probe (prints results, does not fail)
        run: |
          python tests/make_synth.py "中文 資料夾/影片" 1 960x540
          python - <<'PY'
          import subprocess, numpy as np, cv2
          from pathlib import Path
          d = Path("中文 資料夾/影片"); w = Path("中文 資料夾/work/練習/影片一"); w.mkdir(parents=True, exist_ok=True)
          def probe(name, f):
              try: print(f"{name}: {'OK' if f() else 'FAIL'}")
              except Exception as e: print(f"{name}: FAIL {type(e).__name__}: {e}")
          for src in (d / "land.mp4",):
              probe("cv2.VideoCapture source", lambda: cv2.VideoCapture(str(src)).read()[0])
          probe("ffmpeg write work/", lambda: subprocess.run(["ffmpeg", "-v", "error", "-y", "-i", str(d / "land.mp4"), "-an", "-c:v", "libx264", str(w / "proxy.mp4")]).returncode == 0)
          probe("ffprobe work/", lambda: subprocess.run(["ffprobe", "-v", "error", str(w / "proxy.mp4")]).returncode == 0)
          probe("cv2.VideoCapture work/", lambda: cv2.VideoCapture(str(w / "proxy.mp4")).read()[0])
          img = np.zeros((8, 8, 3), np.uint8)
          probe("cv2.imwrite", lambda: cv2.imwrite(str(w / "圖.jpg"), img))
          probe("cv2.imread", lambda: cv2.imread(str(w / "圖.jpg")) is not None)
          probe("np.save/load", lambda: (np.save(w / "姿態.npy", img), np.array_equal(np.load(w / "姿態.npy"), img))[1])
          PY
      - name: pose + ball on a synthetic clip (real models, no people or ball -> all NaN is valid)
        run: |
          python tests/make_synth.py synth 2 960x540
          mkdir -p synth/d
          ffmpeg -v error -y -i synth/land.mp4 -an -vf scale=960:540,fps=60 -c:v libx264 synth/d/proxy.mp4
          python -I tools/pose_full.py synth/d/proxy.mp4 models/pose_heavy.task synth/d/pose.npy 2
          python -I tools/ball.py synth/d/proxy.mp4 synth/d/ball.npy
          python -c "import numpy as n; p=n.load('synth/d/pose.npy'); b=n.load('synth/d/ball.npy'); print(p.shape, b.shape); assert p.shape[1:]==(33,3) and b.shape[1]==3 and len(p)==len(b)==120"
