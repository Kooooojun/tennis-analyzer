# Synthetic data only: never testset/, videos/, work/ or web/sessions/. No artifacts are uploaded.
# balltrack_best.pth: the HF page declares no license, so CI only downloads it into the runner cache (never redistributed).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # CPU ball is ~1 s/frame on runners
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk libegl1 libgles2 ;;  # CJK font for annotate.py; EGL/GLES for mediapipe
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: models
          key: models-${{ hashFiles('setup.py') }}
      - name: setup.py (venv, pip, model download to .part + sha256, import check)
        run: |
          # CPU torch on Linux/Windows (same 2.15.0 pin, +cpu build) instead of the multi-GB CUDA wheel; macOS uses PyPI
          [ "$RUNNER_OS" = macOS ] || export PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
          python setup.py
          # later steps run the venv's Python as `python`
          [ "$RUNNER_OS" = Windows ] && cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH" || echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: venv on PATH; run.py passes the exit code through
        run: |
          python -c "import sys; print(sys.prefix); assert '.venv' in sys.prefix"
          printf 'import sys; sys.exit(7)\n' > tools/_seven.py
          set +e; python tools/run.py _seven.py; rc=$?; set -e
          rm tools/_seven.py; [ $rc = 7 ] || { echo "run.py returned $rc, want 7"; exit 1; }
      - name: unit tests + prep.py E2E on a synthetic clip with the real models (each file is a plain-assert script)
        run: |
          fail=0
          for f in tests/test_*.py tools/test_*.py; do
            [ "$f" = tests/test_hand.py ] && continue  # needs private testset/
            echo "== $f"; python "$f" || { echo "FAILED $f"; fail=1; }
          done
          exit $fail
      - name: site smoke under a non-UTF-8 console
        run: |
          [ "$RUNNER_OS" = Windows ] && chcp.com 936 || true
          PYTHONIOENCODING=cp1252 python tests/test_site_smoke.py
      - name: non-ASCII path probe (prints results, does not fail)
        run: |
          python tests/make_synth.py "中文 資料夾/影片" 1 960x540
          python - <<'PY'
          import subprocess, sys, numpy as np, cv2
          sys.stdout.reconfigure(encoding="utf-8")
          from pathlib import Path
          d = Path("中文 資料夾/影片"); w = Path("中文 資料夾/work/練習/影片一"); w.mkdir(parents=True, exist_ok=True)
          def probe(name, f):
              try: print(f"{name}: {'OK' if f() else 'FAIL'}")
              except Exception as e: print(f"{name}: FAIL {type(e).__name__}: {e}")
          for src in (d / "land.mp4",):
              probe("cv2.VideoCapture source", lambda: cv2.VideoCapture(str(src)).read()[0])
          probe("ffmpeg write work/", lambda: subprocess.run(["ffmpeg", "-v", "error", "-y", "-i", str(d / "land.mp4"), "-an", "-c:v", "libx264", str(w / "proxy.mp4")]).returncode == 0)
          probe("ffprobe work/", lambda: subprocess.run(["ffprobe", "-v", "error", str(w / "proxy.mp4")]).returncode == 0)
          probe("cv2.VideoCapture work/", lambda: cv2.VideoCapture(str(w / "proxy.mp4")).read()[0])
          img = np.zeros((8, 8, 3), np.uint8)
          probe("cv2.imwrite", lambda: cv2.imwrite(str(w / "圖.jpg"), img))
          probe("cv2.imread", lambda: cv2.imread(str(w / "圖.jpg")) is not None)
          sys.path.insert(0, "tools"); from platform_util import imwrite
          probe("platform_util.imwrite + imdecode", lambda: imwrite(w / "圖2.jpg", img) and cv2.imdecode(np.fromfile(w / "圖2.jpg", np.uint8), 1) is not None)
          probe("np.save/load", lambda: (np.save(w / "姿態.npy", img), np.array_equal(np.load(w / "姿態.npy"), img))[1])
          PY
